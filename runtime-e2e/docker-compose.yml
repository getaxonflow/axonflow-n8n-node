# Runtime E2E harness for @axonflow/n8n-nodes-axonflow
#
# Brings up: Postgres + Redis + AxonFlow Agent and Orchestrator (community) + n8n
#
# The orchestrator is not optional: on AxonFlow v11 the agent proxies
# /api/v1/audit/tool-call (Record Decision, Audit Log) to it, and without it
# that route answers 502.
#
# Usage:
#   cd runtime-e2e
#   docker compose up -d
#   ./_lib/install-node-into-n8n.sh
#   ./run-all.sh
#   docker compose down -v
#
# No service has a container_name: the compose project is the identity, so two
# stacks (two projects) can run on one machine. Host ports and the agent and
# orchestrator images are variables whose defaults are the values CI uses; see README.md
# "Running beside another stack".
# Ports bind to 127.0.0.1 only: the database password below is public.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: axonflow
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: axonflow
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axonflow -d axonflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - e2e-network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - e2e-network

  axonflow-agent:
    image: ${AXONFLOW_AGENT_IMAGE:-ghcr.io/getaxonflow/axonflow-agent:latest}
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: axonflow
      DATABASE_USER: axonflow
      DATABASE_PASSWORD: localdev123
      DATABASE_SSLMODE: disable
      DATABASE_URL: postgres://axonflow:localdev123@postgres:5432/axonflow?sslmode=disable
      AXONFLOW_DB_USE_APP_ROLE: "false"
      AXONFLOW_CLIENT_ID: ${AXONFLOW_CLIENT_ID:-e2e-n8n-test}
      ORG_ID: ${ORG_ID:-e2e-n8n-test}
      DEPLOYMENT_KIND: dev
      PORT: 8080
      ENVIRONMENT: development
      LOG_LEVEL: debug
      DEPLOYMENT_MODE: community
      AXONFLOW_VERSION: "8.1.0"
      REDIS_URL: redis://redis:6379
      ORCHESTRATOR_URL: http://axonflow-orchestrator:8081
      AXONFLOW_INTERNAL_SERVICE_SECRET: e2e-internal-service-secret
      AXONFLOW_TELEMETRY: "off"
      CI: "true"
    ports:
      - "127.0.0.1:${AGENT_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - e2e-network

  axonflow-orchestrator:
    image: ${AXONFLOW_ORCHESTRATOR_IMAGE:-ghcr.io/getaxonflow/axonflow-orchestrator:latest}
    environment:
      PORT: 8081
      DEPLOYMENT_MODE: community
      DEPLOYMENT_KIND: dev
      ENVIRONMENT: development
      LOG_LEVEL: debug
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: axonflow
      DATABASE_USER: axonflow
      DATABASE_PASSWORD: localdev123
      DATABASE_SSLMODE: disable
      AXONFLOW_DB_USE_APP_ROLE: "false"
      AGENT_MCP_ENDPOINT: http://axonflow-agent:8080
      AXONFLOW_INTERNAL_SERVICE_SECRET: e2e-internal-service-secret
      ORG_ID: ${ORG_ID:-e2e-n8n-test}
      AXONFLOW_TELEMETRY: "off"
      CI: "true"
    ports:
      - "127.0.0.1:${ORCHESTRATOR_HOST_PORT:-18081}:8081"
    depends_on:
      axonflow-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - e2e-network

  n8n:
    # Pinned: the n8n release axonflow-n8n-node#9 was measured on. See README.md.
    image: n8nio/n8n:2.38.7
    environment:
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_HOST: localhost
      WEBHOOK_URL: http://n8n:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      EXECUTIONS_PROCESS: main
      GENERIC_TIMEZONE: UTC
      # Disable auth for E2E testing so API calls don't need credentials
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_USER_MANAGEMENT_DISABLED: "false"
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-15678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      axonflow-agent:
        condition: service_healthy
      axonflow-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - e2e-network

volumes:
  n8n-data:

networks:
  e2e-network:
    driver: bridge
