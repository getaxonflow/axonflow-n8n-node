name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Extract CHANGELOG section
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '$0 ~ "^## \\["ver"\\]" {p=1; next} p && /^## \[/ {exit} p {print}' CHANGELOG.md > /tmp/release-body.md
          if [ ! -s /tmp/release-body.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION — refusing to publish."
            echo "::error::Add a '## [$VERSION] - YYYY-MM-DD' section to CHANGELOG.md and re-tag."
            exit 1
          fi
          {
            echo "## @axonflow/n8n-nodes-axonflow v${VERSION}"
            echo ""
            echo "### Installation"
            echo ""
            echo '```bash'
            echo "npm install @axonflow/n8n-nodes-axonflow@${VERSION}"
            echo '```'
            echo ""
            echo "Or install via n8n GUI: **Settings > Community Nodes > Install >** \`@axonflow/n8n-nodes-axonflow\`."
            echo ""
            cat /tmp/release-body.md
          } > /tmp/release-body-final.md
          echo "Release body: $(wc -l < /tmp/release-body-final.md) lines"

      - name: Upload release body artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-body
          path: /tmp/release-body-final.md
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: 'npm'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          npm version ${VERSION} --no-git-tag-version --allow-same-version
          echo "Updated version to ${VERSION}"
          grep '"version"' package.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: |
            dist/
            package.json
            package-lock.json
            CHANGELOG.md
            LICENSE
            README.md
            examples/
          retention-days: 1

  runtime-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build AxonFlow agent image
        run: |
          git clone --depth 1 https://github.com/getaxonflow/axonflow.git /tmp/axonflow
          docker build -t ghcr.io/getaxonflow/axonflow-agent:latest \
            -f /tmp/axonflow/platform/agent/Dockerfile \
            --build-arg EDITION=community \
            /tmp/axonflow

      - name: Start E2E stack
        working-directory: runtime-e2e
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for axonflow-agent..."
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null --max-time 2 "http://localhost:18080/health" 2>/dev/null; then
              echo "axonflow-agent healthy (${i}s)"
              break
            fi
            if [ "$i" -eq 120 ]; then echo "FATAL: agent not healthy"; exit 1; fi
            sleep 1
          done
          echo "Verifying API routes are registered..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 \
              -X POST http://localhost:18080/api/v1/mcp/check-input \
              -H "Content-Type: application/json" \
              -d '{"connector_type":"healthcheck","statement":"noop","operation":"query"}' 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "404" ] && [ "$HTTP_CODE" != "000" ]; then
              echo "API routes ready (HTTP $HTTP_CODE) after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::API routes not ready after 30s (last HTTP $HTTP_CODE)"
              docker compose -f runtime-e2e/docker-compose.yml logs
              exit 1
            fi
            sleep 1
          done
          echo "Waiting for n8n..."
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null --max-time 2 "http://localhost:15678/healthz" 2>/dev/null; then
              echo "n8n healthy (${i}s)"
              break
            fi
            if [ "$i" -eq 90 ]; then echo "FATAL: n8n not healthy"; exit 1; fi
            sleep 1
          done

      - name: Run E2E tests
        working-directory: runtime-e2e
        env:
          AXONFLOW_TELEMETRY: "off"
        run: |
          START_TIME=$(date +%s)
          chmod +x run-all.sh
          ./run-all.sh --skip-up
          ELAPSED=$(($(date +%s) - START_TIME))
          echo "Total runtime-e2e duration: ${ELAPSED}s"
          if [ "$ELAPSED" -lt 60 ]; then
            echo "::error::runtime-e2e completed in ${ELAPSED}s (< 60s floor) — suspect silent skip"
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        working-directory: runtime-e2e
        run: |
          docker compose logs > /tmp/e2e-docker-logs.txt 2>&1 || true
          echo "=== Docker logs ==="
          tail -200 /tmp/e2e-docker-logs.txt

      - name: Tear down E2E stack
        if: always()
        working-directory: runtime-e2e
        run: docker compose down -v

  publish:
    needs: [preflight, lint, build-and-test]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Use Node.js 20
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update version in package.json
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        npm version ${VERSION} --no-git-tag-version --allow-same-version
        echo "Updated version to ${VERSION}"
        grep '"version"' package.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Publish to npm
      run: npm publish --access public --provenance

  create-release:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download release body artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: release-body
        path: /tmp/release-body

    - name: Create GitHub Release
      uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
      with:
        name: Release ${{ github.ref_name }}
        body_path: /tmp/release-body/release-body-final.md
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-publish:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    steps:
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Wait for npm propagation
      run: sleep 30

    - name: Verify package on npm
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        for i in 1 2 3 4 5; do
          echo "Attempt $i: Checking npm for @axonflow/n8n-nodes-axonflow@${VERSION}..."
          if npm view @axonflow/n8n-nodes-axonflow@${VERSION} version 2>/dev/null | grep -q "${VERSION}"; then
            echo "SUCCESS: @axonflow/n8n-nodes-axonflow@${VERSION} is available on npm"
            exit 0
          fi
          echo "Not yet available, waiting 30 seconds..."
          sleep 30
        done
        echo "FAILURE: @axonflow/n8n-nodes-axonflow@${VERSION} not found on npm after 5 attempts"
        exit 1
